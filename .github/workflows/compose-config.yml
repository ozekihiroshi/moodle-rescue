name: Compose configuration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate production configuration
        run: docker compose --env-file .env.production.example -f docker-compose.yml config --quiet
      - name: Validate local configuration
        run: docker compose --env-file .env.example -f docker-compose.local.yml config --quiet
      - name: Validate release-test configuration
        run: docker compose --env-file .env.example --env-file .env.release-test.example -f docker-compose.release-test.yml config --quiet
      - name: Validate UI lifecycle configuration
        run: docker compose --env-file .env.ui-test.example -f docker-compose.ui-test.yml config --quiet
