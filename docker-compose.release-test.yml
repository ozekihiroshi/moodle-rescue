name: ${RELEASE_COMPOSE_PROJECT_NAME:-moodle-rescue-release-test}

x-release-build: &release-build
  context: .
  dockerfile: moodle/Dockerfile.release-test
  args:
    MOODLE_BASE_IMAGE: ${MOODLE_BASE_IMAGE:-moodle-rescue-local-moodle}

x-release-environment: &release-environment
  MOODLE_DB_HOST: moodle-release-db
  MOODLE_DB_NAME: ${RELEASE_TEST_DB_NAME:-moodle_release_test}
  MOODLE_DB_USER: ${RELEASE_TEST_DB_USER:-moodle_release_test}
  MOODLE_DB_PASSWORD: ${RELEASE_TEST_DB_PASSWORD}
  MOODLE_WWWROOT: ${RELEASE_TEST_WWWROOT:-http://localhost:8084}
  MOODLE_REVERSE_PROXY: "false"
  MOODLE_SSL_PROXY: "false"
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  AWS_REGION: ap-northeast-1
  AWS_EC2_METADATA_DISABLED: "true"
  TOOL_SECURE_S3_STORAGE_S3_ENDPOINT: http://minio:9000

x-release-service: &release-service
  image: ${RELEASE_MOODLE_IMAGE:-moodle-rescue-release-test-moodle}
  environment: *release-environment
  volumes:
    - release_moodle_data:/var/moodledata
    - release_backups:/var/moodlebackups
  networks:
    - release_internal
    - release_access
    - source_minio

services:
  moodle-release-install:
    <<: *release-service
    build: *release-build
    container_name: ${RELEASE_CONTAINER_PREFIX:-moodle-rescue-release}-install
    restart: "no"
    command: ["moodle-release-test-install"]
    environment:
      <<: *release-environment
      RELEASE_TEST_ADMIN_PASSWORD: ${RELEASE_TEST_ADMIN_PASSWORD}
    depends_on:
      moodle-release-db:
        condition: service_healthy

  moodle-release:
    <<: *release-service
    build: *release-build
    container_name: ${RELEASE_CONTAINER_PREFIX:-moodle-rescue-release}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RELEASE_MOODLE_PORT:-8084}:80"
    depends_on:
      moodle-release-install:
        condition: service_completed_successfully

  moodle-release-cron:
    <<: *release-service
    build: *release-build
    container_name: ${RELEASE_CONTAINER_PREFIX:-moodle-rescue-release}-cron
    restart: unless-stopped
    command: ["moodle-cron-loop"]
    environment:
      <<: *release-environment
      MOODLE_CRON_INTERVAL_SECONDS: "60"
    volumes:
      - release_moodle_data:/var/moodledata
      - release_backups:/var/moodlebackups
      - release_database_artifacts:/database-artifacts:ro
    depends_on:
      moodle-release-install:
        condition: service_completed_successfully

  moodle-release-negative-db-test:
    <<: *release-service
    profiles: ["tools"]
    container_name: ${RELEASE_CONTAINER_PREFIX:-moodle-rescue-release}-negative-db-test
    restart: "no"
    volumes:
      - release_moodle_data:/var/moodledata
      - release_backups:/var/moodlebackups
      - release_database_negative_artifacts:/database-artifacts:ro
    depends_on:
      moodle-release-install:
        condition: service_completed_successfully

  release-db-negative-fixtures:
    image: mariadb:11.8
    profiles: ["tools"]
    restart: "no"
    entrypoint: ["/bin/sh", "/usr/local/bin/database-negative-fixtures"]
    environment:
      DATABASE_ARTIFACT_DESTINATION: /database-artifacts
      DATABASE_BACKUP_READER_GID: "33"
    volumes:
      - ./moodle/database-negative-fixtures.sh:/usr/local/bin/database-negative-fixtures:ro
      - release_database_negative_artifacts:/database-artifacts
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE

  moodle-release-db:
    image: mariadb:11.8
    container_name: ${RELEASE_CONTAINER_PREFIX:-moodle-rescue-release}-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${RELEASE_TEST_DB_NAME:-moodle_release_test}
      MARIADB_USER: ${RELEASE_TEST_DB_USER:-moodle_release_test}
      MARIADB_PASSWORD: ${RELEASE_TEST_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${RELEASE_TEST_DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - release_db:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - healthcheck.sh --connect --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - release_internal

  release-fetch:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["tools"]
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - >
        mc alias set source http://minio:9000
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" >/dev/null &&
        mc cp "source/$$MINIO_BUCKET/$$RELEASE_TEST_OBJECT_KEY"
        "$$RELEASE_TEST_BACKUP_FILE"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      RELEASE_TEST_OBJECT_KEY: ${RELEASE_TEST_OBJECT_KEY}
      RELEASE_TEST_BACKUP_FILE: /out/release-gate-source.mbz
    volumes:
      - release_backups:/out
    networks:
      - source_minio

  release-db-fetch:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["tools"]
    entrypoint: ["/bin/sh", "/usr/local/bin/database-artifact-fetch"]
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${MINIO_BUCKET}
      S3_PREFIX: moodle/
      DATABASE_ARTIFACT_DESTINATION: /database-artifacts
    volumes:
      - ./moodle/database-artifact-fetch.sh:/usr/local/bin/database-artifact-fetch:ro
      - release_database_downloads:/database-artifacts
    networks:
      - source_minio

  release-restore:
    <<: *release-service
    profiles: ["tools"]
    container_name: ${RELEASE_CONTAINER_PREFIX:-moodle-rescue-release}-restore
    restart: "no"
    command: ["moodle-release-test-restore"]
    environment:
      <<: *release-environment
      RELEASE_TEST_BACKUP_FILE: /var/moodlebackups/release-gate-source.mbz
      S3_TEST_CONTENT_MARKER: secure-s3-integration-marker-v1
    depends_on:
      moodle-release-install:
        condition: service_completed_successfully

volumes:
  release_moodle_data:
  release_backups:
  release_db:
  release_database_negative_artifacts:
  release_database_downloads:
  release_database_artifacts:
    external: true
    name: ${RELEASE_TEST_DATABASE_ARTIFACT_VOLUME:-moodle-rescue-local_moodle_database_artifacts}

networks:
  release_internal:
    internal: true
  release_access:
  source_minio:
    external: true
    name: ${SOURCE_MINIO_NETWORK:-moodle-rescue-local_internal}
