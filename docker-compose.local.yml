name: ${LOCAL_COMPOSE_PROJECT_NAME:-moodle-rescue-local}

services:
  moodle:
    build:
      context: ./moodle
      args:
        MOODLE_VERSION: 5.2.2
        MOODLE_SHA256: 72be209e7c0f5341b87de0bc993b2430087fda2769d8c3cc2f32736d1513e88c
    container_name: ${LOCAL_CONTAINER_PREFIX:-moodle-rescue}-local
    restart: unless-stopped
    environment: &moodle-environment
      MOODLE_DB_HOST: moodle-db
      MOODLE_DB_NAME: ${MOODLE_DB_NAME}
      MOODLE_DB_USER: ${MOODLE_DB_USER}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost:8083}
      MOODLE_REVERSE_PROXY: "false"
      MOODLE_SSL_PROXY: "false"
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_REGION: ap-northeast-1
      AWS_EC2_METADATA_DISABLED: "true"
      TOOL_SECURE_S3_STORAGE_S3_ENDPOINT: http://minio:9000
    ports:
      - "127.0.0.1:${LOCAL_MOODLE_PORT:-8083}:80"
    volumes:
      - moodle_data:/var/moodledata
      - moodle_backups:/var/moodlebackups
      - ${PLUGIN_SOURCE_PATH:-../secure-s3-storage-for-moodle}:/var/www/html/public/admin/tool/secure_s3_storage:ro
    depends_on:
      moodle-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - internal
      - local_access

  moodle-cron:
    build:
      context: ./moodle
      args:
        MOODLE_VERSION: 5.2.2
        MOODLE_SHA256: 72be209e7c0f5341b87de0bc993b2430087fda2769d8c3cc2f32736d1513e88c
    container_name: ${LOCAL_CONTAINER_PREFIX:-moodle-rescue}-cron-local
    restart: unless-stopped
    command: ["moodle-cron-loop"]
    environment:
      <<: *moodle-environment
      MOODLE_CRON_INTERVAL_SECONDS: "60"
    volumes:
      - moodle_data:/var/moodledata
      - moodle_backups:/var/moodlebackups
      - ${PLUGIN_SOURCE_PATH:-../secure-s3-storage-for-moodle}:/var/www/html/public/admin/tool/secure_s3_storage:ro
    depends_on:
      moodle-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - internal

  moodle-db:
    image: mariadb:11.8
    container_name: ${LOCAL_CONTAINER_PREFIX:-moodle-rescue}-db-local
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MOODLE_DB_NAME}
      MARIADB_USER: ${MOODLE_DB_USER}
      MARIADB_PASSWORD: ${MOODLE_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MOODLE_DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - moodle_db:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - healthcheck.sh --connect --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - internal

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ${LOCAL_CONTAINER_PREFIX:-moodle-rescue}-minio-local
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${LOCAL_MINIO_API_PORT:-9002}:9000"
      - "127.0.0.1:${LOCAL_MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    networks:
      - internal
      - local_access

  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ${LOCAL_CONTAINER_PREFIX:-moodle-rescue}-minio-init-local
    restart: "no"
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET" &&
        mc admin user add local "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" &&
        mc admin policy create local secure-s3-storage /policy/secure-s3-storage-policy.json &&
        mc admin policy attach local secure-s3-storage --user "$$S3_ACCESS_KEY_ID"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - ./moodle/minio/secure-s3-storage-policy.json:/policy/secure-s3-storage-policy.json:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal

volumes:
  moodle_data:
  moodle_backups:
  moodle_db:
  minio_data:

networks:
  internal:
    internal: true
  local_access:
